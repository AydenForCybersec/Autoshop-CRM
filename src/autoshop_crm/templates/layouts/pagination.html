{% if pagination.pages > 1 %}
<nav class="pagination" aria-label="Pagination">
    {% if pagination.has_prev %}
        <a class="btn btn-secondary" href="?page={{ pagination.prev_num }}">Previous</a>
    {% else %}
        <span class="btn btn-disabled">Previous</span>
    {% endif %}

    <span class="page-indicator">Page {{ pagination.page }} of {{ pagination.pages }}</span>

    {% if pagination.has_next %}
        <a class="btn btn-secondary" href="?page={{ pagination.next_num }}">Next</a>
    {% else %}
        <span class="btn btn-disabled">Next</span>
    {% endif %}
</nav>
{% endif %}
